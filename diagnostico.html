<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Diagnóstico del lanyard</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0a0a0a; color: #e8e8e8;
    font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 16px; padding-bottom: 48px;
  }
  h1 { font-size: 21px; letter-spacing: -0.01em; margin: 0 0 6px; }
  p.lead { margin: 0 0 20px; color: #9a9a9a; font-size: 13px; }
  .modos { display: grid; gap: 8px; margin-bottom: 18px; }
  button {
    font: inherit; text-align: left; padding: 13px 14px; border-radius: 10px;
    border: 1px solid #333; background: #161616; color: #e8e8e8;
  }
  button[aria-pressed="true"] { background: #e8e8e8; color: #111; border-color: #e8e8e8; }
  button b { display: block; font-weight: 700; font-size: 15px; }
  button span { display: block; font-size: 12px; opacity: .72; margin-top: 3px; line-height: 1.45; }
  #escena {
    position: relative; width: 100%; height: 62vh; min-height: 380px;
    border: 1px solid #262626; border-radius: 12px; overflow: hidden; background: #0a0a0a;
  }
  #escena canvas { display: block; width: 100%; height: 100%; }
  #foto { width: 100%; display: block; border-radius: 12px; }
  #escena[hidden] { display: none; }
  #datos {
    white-space: pre-wrap; word-break: break-word; font-size: 12px; line-height: 1.6;
    background: #111; border: 1px solid #262626; border-radius: 10px; padding: 12px;
    margin-top: 18px; color: #c9c9c9;
  }
  .nota { font-size: 12px; color: #8a8a8a; margin-top: 14px; }
</style>
</head>
<body>

<h1>Diagnóstico del lanyard</h1>
<p class="lead">Toca cada modo, espera a que la tarjeta se quede quieta y mira si salen las franjas negras. Hazme una captura de cada uno.</p>

<div class="modos">
  <button id="m-foto" aria-pressed="true">
    <b>1 · Tarjeta con foto</b>
    <span>Igual que en la web.</span>
  </button>
  <button id="m-lisa" aria-pressed="false">
    <b>2 · Tarjeta SIN foto (la decisiva)</b>
    <span>Tarjeta blanca lisa. Si aquí también salen franjas, la foto no tiene nada que ver.</span>
  </button>
  <button id="m-sola" aria-pressed="false">
    <b>3 · Solo la foto, sin 3D</b>
    <span>La imagen tal cual. Comprueba que el archivo está bien.</span>
  </button>
</div>

<div id="escena"></div>

<div id="datos">Recogiendo datos…</div>
<p class="nota">Esta página no está enlazada desde ningún sitio y no la indexan los buscadores.</p>

<script type="module">
const escena = document.getElementById('escena');
const datos = document.getElementById('datos');
const RETRATO = '/assets/img/about-portrait.webp';

const base = {
  imageFit: 'cover',
  orientation: 'portrait',
  finish: 'glossy',
  cornerRadius: 0.26,
  strapWidth: 0.6,
  metal: 'silver',
  breeze: 0.35,
  interactive: true,
  intro: true,
  anchor: 0.5,
  size: 0.55,
  strapLength: 0.2
};

let modulo = null;
let colgado = null;

const limpiar = () => {
  if (colgado) { colgado.destroy(); colgado = null; }
  escena.innerHTML = '';
  const previa = document.getElementById('foto');
  if (previa) previa.remove();
};

const montar = async (conFoto) => {
  limpiar();
  escena.hidden = false;
  if (!modulo) modulo = await import('/assets/js/lanyard.js');
  colgado = modulo.createLanyard(escena, Object.assign({}, base, conFoto
    ? { frontImage: RETRATO, cardColor: '#141414', strapColor: '#e8e8e8' }
    /* Blanco liso: cualquier franja negra aquí no puede venir de la foto,
       porque no hay foto. */
    : { frontImage: undefined, cardColor: '#ffffff', strapColor: '#e8e8e8' }));
  if (!colgado) escena.textContent = 'Este navegador no ha podido abrir WebGL.';
};

/* Built here rather than sitting empty in the document, so the page never
   carries an <img> without a picture in it. */
const soloFoto = () => {
  limpiar();
  escena.hidden = true;
  const foto = document.createElement('img');
  /* The picture first, and the element reaches the document only once it has
     one, so there is never an <img> on the page without a picture in it. */
  foto.src = RETRATO + '?v=' + Date.now();
  foto.alt = 'El retrato tal cual, sin pasar por el 3D';
  foto.id = 'foto';
  escena.insertAdjacentElement('afterend', foto);
};

const botones = [
  [document.getElementById('m-foto'), () => montar(true)],
  [document.getElementById('m-lisa'), () => montar(false)],
  [document.getElementById('m-sola'), soloFoto]
];
botones.forEach(([boton, accion]) => {
  boton.addEventListener('click', () => {
    botones.forEach(([otro]) => otro.setAttribute('aria-pressed', String(otro === boton)));
    accion();
  });
});

/* Lo que cuenta de este dispositivo, para no tener que adivinarlo. */
const recoger = async () => {
  const lineas = [];
  lineas.push('navegador: ' + navigator.userAgent);
  lineas.push('densidad de pantalla: ' + window.devicePixelRatio);
  lineas.push('ventana: ' + innerWidth + ' x ' + innerHeight);

  const prueba = document.createElement('canvas');
  const gl2 = prueba.getContext('webgl2');
  const gl = gl2 || prueba.getContext('webgl');
  if (!gl) {
    lineas.push('WebGL: no disponible');
  } else {
    lineas.push('WebGL: ' + (gl2 ? '2' : '1'));
    lineas.push('textura maxima: ' + gl.getParameter(gl.MAX_TEXTURE_SIZE));
    const info = gl.getExtension('WEBGL_debug_renderer_info');
    if (info) lineas.push('GPU: ' + gl.getParameter(info.UNMASKED_RENDERER_WEBGL));
    const perder = gl.getExtension('WEBGL_lose_context');
    if (perder) perder.loseContext();
  }

  lineas.push('createImageBitmap: ' + (typeof createImageBitmap === 'function' ? 'si' : 'NO'));
  try {
    const respuesta = await fetch(RETRATO + '?v=' + Date.now());
    lineas.push('descarga del retrato: ' + respuesta.status + ', ' +
      (respuesta.headers.get('content-length') || '?') + ' bytes');
    const trozo = await respuesta.blob();
    lineas.push('tipo: ' + trozo.type + ', ' + trozo.size + ' bytes recibidos');
    if (typeof createImageBitmap === 'function') {
      const mapa = await createImageBitmap(trozo, { imageOrientation: 'flipY' });
      lineas.push('bitmap decodificado: ' + mapa.width + ' x ' + mapa.height);
      mapa.close?.();
    }
  } catch (fallo) {
    lineas.push('FALLO al cargar el retrato: ' + fallo);
  }
  datos.textContent = lineas.join('\n');
};

montar(true);
recoger();
</script>

</body>
</html>
