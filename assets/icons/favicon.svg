<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 268.32 268.32" width="268.32" height="268.32">
<!--
  The mark as it appears in the browser's tab.

  A filled black tile with the mark in white, the same as the .ico and the
  PNGs beside it, so every surface that shows this site shows one icon. It
  was drawn on nothing before and turned over with the browser's own light
  or dark, which left it to disappear into whatever it happened to land on.
  A tile carries its own contrast wherever it goes.

  Separate from logo.svg on purpose: that one is drawn white and the page
  turns it over with the theme, so it cannot also be the tab's.

  The mark is 62% of the tile's height and centred on it, which is the same
  proportion the .ico and the PNGs are built to.
-->
<rect width="268.32" height="268.32" fill="#111111"/>
<g transform="translate(54.18 50.98) scale(0.62)">
  <path fill="#F4F4F4" d="M108.529 144.269L131.356 156.755L24.3703 222.325L0 181.001L110.885 121.715V146.686L0 87.3188L24.3703 46.7204L131.356 111.485L108.529 124.776L105.361 0H152.558L149.39 124.776L127.375 111.485L234.361 46.7204L258 87.3188L147.846 146.605V121.634L258 180.921L234.361 222.244L127.375 156.755L149.39 144.269L152.558 268.32H105.361L108.529 144.269Z"/>
</g>
</svg>
