<!doctype html>
<html lang="es" data-lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The two settings are read before anything is drawn: a page that opened in
     the dark and turned light a moment later would be worse than either. -->
<script>(function(){var r=document.documentElement;try{var t=localStorage.getItem('vc-theme');if(t==='light'||t==='dark')r.setAttribute('data-theme',t);}catch(e){}
/* This one page answers for every address that has none, so its language is
   the language of the address that was asked for. */
if(location.pathname.indexOf('/en/')===0||location.pathname==='/en'){r.setAttribute('data-lang','en');r.setAttribute('lang','en');}})();</script>
<title>Página no encontrada — Victor Chaves</title>
<meta name="description" content="La página que buscabas no existe o se ha movido.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#111111">
<!-- Everything here is addressed from the root: this page is served under
     whatever address was asked for, so a relative path would point into a
     folder that does not exist. -->
<link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/geist-mono-variable-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/geist-variable-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>

<main class="err">
  <p class="err__label">[ Error 404 ]</p>

  <h1 class="err__display" data-only="es" lang="es">Esta página<br>no existe.</h1>
  <h1 class="err__display" data-only="en" lang="en">This page<br>does not exist.</h1>

  <p class="err__copy" data-only="es" lang="es">El enlace está roto o la página se ha movido.<br>
    Desde la portada se llega a todo lo demás.</p>
  <p class="err__copy" data-only="en" lang="en">The link is broken or the page has moved.<br>
    Everything else is one step from the landing.</p>

  <a class="err__btn" href="/">
    <span data-t data-es="Volver al inicio" data-en="Back to the landing">Volver al inicio</span>
    <img src="/assets/icons/arrow-up-right.svg" alt="" width="24" height="24" aria-hidden="true">
  </a>
</main>

<!-- The page carries no script of its own beyond this: the few words that are
     not duplicated in the markup are said in the language that was chosen. -->
<script>
  (function () {
    var lang = document.documentElement.getAttribute('data-lang') === 'en' ? 'en' : 'es';
    var words = document.querySelectorAll('[data-t]');
    for (var i = 0; i < words.length; i++) {
      var said = words[i].getAttribute('data-' + lang);
      if (said !== null) words[i].textContent = said;
    }
    // Home is the landing of the language that was asked for.
    if (lang === 'en') document.querySelector('.err__btn').setAttribute('href', '/en');
  })();
</script>

<!-- Visits, counted without cookies: the script is served from this
     domain, so it is no one else's request and it stores nothing. -->
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
